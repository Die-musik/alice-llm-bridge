[workspace]
resolver = "3"
members = [
    "crates/alice-protocol",
    "crates/llm-providers",
    "crates/bridge-core",
    "crates/bridge-server",
    "crates/codex-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
alice-protocol = { path = "crates/alice-protocol" }
llm-providers = { path = "crates/llm-providers" }
bridge-core = { path = "crates/bridge-core" }
codex-runtime = { path = "crates/codex-runtime" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.10"
dashmap = "6"
hex = "0.4"
hmac = "0.12"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
